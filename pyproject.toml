[project]
name = "flotilla"
version = "0.1.0"
description = "Manage a small fleet of machines on a NetBird network: groups, layered config, SSH, GitHub, toolchains and omp, planned and applied with pyinfra."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pyinfra>=3.10",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
flotilla = "flotilla.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
