<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>flotilla</title>
<style>
  :root {
    color-scheme: light dark; --fg: CanvasText; --bg: Canvas;
    --muted: color-mix(in srgb, CanvasText 55%, transparent);
    --line: color-mix(in srgb, CanvasText 14%, transparent);
    --card: color-mix(in srgb, CanvasText 4%, Canvas);
    --ok: #2f9e44; --warn: #e8a317; --bad: #e03131; --acc: #3b6cf6;
    --base: #3b6cf6; --grp: #9c36b5; --host: #d9480f;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 14px;
  }
  * { box-sizing: border-box; } body { margin: 0; background: var(--bg); color: var(--fg); }
  header { display: flex; align-items: center; gap: 1.25rem; padding: .7rem 1.25rem; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
  header h1 { font-size: 1.05rem; margin: 0; } nav { display: flex; gap: .25rem; }
  nav button { background: none; border: 0; padding: .45rem .8rem; border-radius: 8px; cursor: pointer; color: var(--muted); font: inherit; }
  nav button.on { background: var(--card); color: var(--fg); font-weight: 600; }
  main { padding: 1.25rem; max-width: 1500px; margin: 0 auto; }
  section[hidden] { display: none !important; }
  button.b { font: inherit; padding: .35rem .7rem; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
  button.b.pri { background: var(--acc); border-color: var(--acc); color: white; } button.b.danger { background: var(--bad); border-color: var(--bad); color: white; }
  button.b.sm { padding: .15rem .45rem; font-size: 12px; }
  button.b:disabled { opacity: .5; cursor: default; }
  input, select, textarea { font: inherit; padding: .35rem .5rem; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; } .muted { color: var(--muted); } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: .9rem; }
  .card { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: .9rem; cursor: pointer; transition: border-color .15s; }
  .card:hover { border-color: var(--acc); } .card h3 { margin: 0 0 .15rem; font-size: 1rem; display: flex; align-items: center; gap: .45rem; }
  .dot { width: .6rem; height: .6rem; border-radius: 50%; display: inline-block; background: var(--muted); } .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: .15rem .7rem; margin-top: .6rem; font-size: 12.5px; } .kv span:nth-child(odd) { color: var(--muted); }
  .tag { display: inline-block; padding: .05rem .45rem; border-radius: 999px; background: color-mix(in srgb, var(--acc) 15%, transparent); font-size: 11.5px; margin-right: .25rem; }
  h2 { font-size: 1rem; margin: 1.4rem 0 .7rem; }
  pre.log { background: color-mix(in srgb, CanvasText 6%, Canvas); border: 1px solid var(--line); border-radius: 10px; padding: .75rem; overflow: auto; max-height: 55vh; white-space: pre-wrap; margin: .5rem 0 0; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100vw); background: var(--bg); border-left: 1px solid var(--line); padding: 1rem 1.2rem; overflow: auto; z-index: 10; box-shadow: -8px 0 30px rgba(0,0,0,.15); }
  table { border-collapse: collapse; } td, th { border: 1px solid var(--line); padding: .35rem .55rem; text-align: left; vertical-align: top; } th { background: var(--card); font-weight: 600; }
  td.cell { cursor: pointer; text-align: center; } td.ok, .ok { color: var(--ok); } td.bad, .bad { color: var(--bad); } td.warn, .warn { color: var(--warn); }
  .diff .add { color: var(--ok); } .diff .del { color: var(--bad); } .diff .hunk { color: var(--acc); }
  .msg { padding: .5rem .7rem; border-radius: 8px; margin-top: .5rem; font-size: 13px; } .msg.err { background: color-mix(in srgb, var(--bad) 15%, transparent); } .msg.okm { background: color-mix(in srgb, var(--ok) 15%, transparent); }
  /* config */
  .cfg { display: grid; grid-template-columns: 230px 1fr; gap: 1.2rem; align-items: start; }
  .blist div.bi { padding: .5rem .6rem; border-radius: 8px; cursor: pointer; border: 1px solid transparent; margin-bottom: .25rem; }
  .blist div.bi:hover { background: var(--card); } .blist div.bi.on { background: var(--card); border-color: var(--line); }
  .blist .nm { font-weight: 600; display: flex; justify-content: space-between; gap: .4rem; } .blist .ds { font-size: 11.5px; }
  .pill { font-size: 11px; padding: .05rem .45rem; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
  .pill.warn { border-color: var(--warn); } .pill.ok { border-color: var(--ok); } .pill.bad { border-color: var(--bad); }
  .chip { font-size: 11px; padding: .05rem .45rem; border-radius: 999px; border: 1px solid; white-space: nowrap; display: inline-block; margin: 0 .15rem .1rem 0; cursor: default; }
  .chip.base { color: var(--base); } .chip.group { color: var(--grp); } .chip.host { color: var(--host); } .chip.skip { color: var(--muted); border-style: dashed; } .chip.delete { color: var(--bad); border-style: dashed; }
  .chip.click { cursor: pointer; } .chip.on { background: color-mix(in srgb, currentColor 14%, transparent); font-weight: 600; }
  .files tr { cursor: pointer; } .files tr:hover td { background: var(--card); } .files tr.on td { background: var(--card); }
  .panel { border: 1px solid var(--line); border-radius: 10px; padding: .75rem; margin-bottom: .8rem; } .panel h4 { margin: 0 0 .5rem; font-size: .9rem; }
  .tabs { display: flex; gap: .3rem; flex-wrap: wrap; align-items: center; margin: .8rem 0 .6rem; }
  .tabs .t { padding: .3rem .6rem; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; font-size: 12.5px; }
  .tabs .t.on { background: var(--card); font-weight: 600; border-color: var(--acc); }
  .edit { display: grid; grid-template-columns: 1fr 280px; gap: 1rem; align-items: start; }
  #editor { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; } #editor .cm-editor { height: 58vh; }
  .explain td { font-size: 12.5px; } .explain td.k { font-family: ui-monospace, Menlo, monospace; white-space: nowrap; } .explain td.v { font-family: ui-monospace, Menlo, monospace; max-width: 520px; overflow-wrap: anywhere; }
  .explain tr.ovr td { background: color-mix(in srgb, var(--grp) 6%, transparent); }
  .models { max-height: 220px; overflow: auto; font-size: 12px; } .models div { padding: .2rem .3rem; border-radius: 5px; cursor: pointer; } .models div:hover { background: var(--card); }
  .ovbox { border: 1px solid var(--acc); border-radius: 10px; padding: .75rem; margin: .6rem 0; display: grid; grid-template-columns: 110px 1fr; gap: .45rem .7rem; align-items: center; }
  .ovbox textarea { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; min-height: 4.5rem; }
  .items td { text-align: center; font-size: 12px; } .items td:first-child { text-align: left; font-family: ui-monospace, Menlo, monospace; }
  .items td.c { cursor: pointer; } .items td.c:hover { outline: 2px solid var(--acc); outline-offset: -2px; }
  .readme { font-size: 13px; line-height: 1.5; } .readme pre { background: var(--card); padding: .5rem; border-radius: 8px; overflow: auto; }
  .menu { position: absolute; z-index: 20; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.18); padding: .3rem; min-width: 220px; }
  .menu div { padding: .35rem .55rem; border-radius: 6px; cursor: pointer; font-size: 13px; } .menu div:hover { background: var(--card); } .menu .h { cursor: default; color: var(--muted); font-size: 11.5px; }
</style>
</head>
<body>
<header>
  <h1>⛵ flotilla</h1>
  <nav>
    <button data-tab="hosts" class="on">Hosts</button>
    <button data-tab="config">Config</button>
    <button data-tab="components">Components</button>
    <button data-tab="jobs">Jobs</button>
  </nav>
  <span class="muted" id="ctl"></span>
</header>
<main>
  <section id="tab-hosts">
    <div class="row">
      <button class="b" id="refresh">Refresh status</button>
      <span class="muted" id="status-note"></span>
    </div>
    <div id="groups"></div>
  </section>

  <section id="tab-config" hidden>
    <div class="cfg">
      <div>
        <div class="blist" id="blist"></div>
        <div class="panel" style="margin-top:1rem"><h4>History</h4><div class="mono muted" id="history" style="max-height:220px;overflow:auto;font-size:11.5px"></div></div>
      </div>
      <div id="bundle"></div>
    </div>
  </section>

  <section id="tab-components" hidden>
    <p class="muted">Components install and log in: keys, CLIs, NetBird, the Paseo deploy. Config files live on the Config page. Plan runs pyinfra in dry-run mode; click a cell for details. Apply asks first.</p>
    <div class="row"><button class="b pri" id="plan-all">Plan every component</button></div>
    <div id="matrix" style="margin-top:1rem"></div>
  </section>

  <section id="tab-jobs" hidden>
    <div id="jobs"></div>
  </section>
</main>
<div class="drawer" id="drawer" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
