<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>flotilla</title>
<style>
  :root {
    color-scheme: light dark; --fg: CanvasText; --bg: Canvas;
    --muted: color-mix(in srgb, CanvasText 55%, transparent);
    --line: color-mix(in srgb, CanvasText 14%, transparent);
    --card: color-mix(in srgb, CanvasText 4%, Canvas);
    --ok: #2f9e44; --warn: #e8a317; --bad: #e03131; --acc: #3b6cf6;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 14px;
  }
  * { box-sizing: border-box; } body { margin: 0; background: var(--bg); color: var(--fg); }
  header { display: flex; align-items: center; gap: 1.25rem; padding: .7rem 1.25rem; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
  header h1 { font-size: 1.05rem; margin: 0; } nav { display: flex; gap: .25rem; }
  nav button { background: none; border: 0; padding: .45rem .8rem; border-radius: 8px; cursor: pointer; color: var(--muted); font: inherit; }
  nav button.on { background: var(--card); color: var(--fg); font-weight: 600; }
  main { padding: 1.25rem; max-width: 1400px; margin: 0 auto; }
  section[hidden] { display: none !important; }
  button.b { font: inherit; padding: .4rem .75rem; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
  button.b.pri { background: var(--acc); border-color: var(--acc); color: white; } button.b.danger { background: var(--bad); border-color: var(--bad); color: white; }
  button.b:disabled { opacity: .5; cursor: default; }
  input, select, textarea { font: inherit; padding: .4rem .55rem; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; } .muted { color: var(--muted); } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: .9rem; }
  .card { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: .9rem; cursor: pointer; transition: border-color .15s; }
  .card:hover { border-color: var(--acc); } .card h3 { margin: 0 0 .15rem; font-size: 1rem; display: flex; align-items: center; gap: .45rem; }
  .dot { width: .6rem; height: .6rem; border-radius: 50%; display: inline-block; background: var(--muted); } .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: .15rem .7rem; margin-top: .6rem; font-size: 12.5px; } .kv span:nth-child(odd) { color: var(--muted); }
  .tag { display: inline-block; padding: .05rem .45rem; border-radius: 999px; background: color-mix(in srgb, var(--acc) 15%, transparent); font-size: 11.5px; margin-right: .25rem; }
  h2 { font-size: 1rem; margin: 1.4rem 0 .7rem; text-transform: capitalize; }
  pre.log { background: color-mix(in srgb, CanvasText 6%, Canvas); border: 1px solid var(--line); border-radius: 10px; padding: .75rem; overflow: auto; max-height: 60vh; white-space: pre-wrap; margin: .5rem 0 0; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 100vw); background: var(--bg); border-left: 1px solid var(--line); padding: 1rem 1.2rem; overflow: auto; z-index: 10; box-shadow: -8px 0 30px rgba(0,0,0,.15); }
  table { border-collapse: collapse; } td, th { border: 1px solid var(--line); padding: .4rem .6rem; text-align: left; } th { background: var(--card); font-weight: 600; }
  td.cell { cursor: pointer; text-align: center; } td.ok { color: var(--ok); } td.bad { color: var(--bad); } td.warn { color: var(--warn); }
  .split { display: grid; grid-template-columns: 280px 1fr 300px; gap: 1rem; align-items: start; }
  .tree { border: 1px solid var(--line); border-radius: 10px; padding: .4rem; max-height: 78vh; overflow: auto; }
  .tree div { padding: .25rem .45rem; border-radius: 6px; cursor: pointer; font-size: 12.5px; white-space: nowrap; } .tree div:hover, .tree div.on { background: var(--card); }
  .tree .dir { color: var(--muted); cursor: default; margin-top: .3rem; }
  #editor { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-height: 70vh; } #editor .cm-editor { height: 70vh; }
  .panel { border: 1px solid var(--line); border-radius: 10px; padding: .75rem; margin-bottom: .8rem; } .panel h4 { margin: 0 0 .5rem; font-size: .9rem; }
  .models { max-height: 260px; overflow: auto; font-size: 12px; } .models div { padding: .2rem .3rem; border-radius: 5px; cursor: pointer; } .models div:hover { background: var(--card); }
  .msg { padding: .5rem .7rem; border-radius: 8px; margin-top: .5rem; font-size: 13px; } .msg.err { background: color-mix(in srgb, var(--bad) 15%, transparent); } .msg.okm { background: color-mix(in srgb, var(--ok) 15%, transparent); }
  .guide { line-height: 1.5; } .guide h2 { text-transform: none; } .guide pre { background: var(--card); padding: .6rem; border-radius: 8px; overflow: auto; }
  form.onb { display: grid; grid-template-columns: 120px 1fr; gap: .5rem .8rem; align-items: center; max-width: 560px; }
  .diff .add { color: var(--ok); } .diff .del { color: var(--bad); } .diff .hunk { color: var(--acc); }
</style>
</head>
<body>
<header>
  <h1>⛵ flotilla</h1>
  <nav>
    <button data-tab="hosts" class="on">Hosts</button>
    <button data-tab="components">Components</button>
    <button data-tab="config">Config</button>
    <button data-tab="onboard">Onboard</button>
    <button data-tab="jobs">Jobs</button>
  </nav>
  <span class="muted" id="ctl"></span>
</header>
<main>
  <section id="tab-hosts">
    <div class="row">
      <button class="b" id="refresh">Refresh status</button>
      <button class="b" id="mesh-btn">Check SSH mesh</button>
      <span class="muted" id="status-note"></span>
    </div>
    <div id="groups"></div>
    <div id="mesh"></div>
  </section>

  <section id="tab-components" hidden>
    <p class="muted">Plan runs pyinfra in dry-run mode and counts the operations that would change. Click a cell for the file diff and the operations. Apply asks first.</p>
    <div class="row"><button class="b pri" id="plan-all">Plan every component</button></div>
    <div id="matrix" style="margin-top:1rem"></div>
  </section>

  <section id="tab-config" hidden>
    <div class="split">
      <div>
        <div class="row" style="margin-bottom:.5rem"><input id="newfile" placeholder="files/omp/hosts/&lt;host&gt;/config.yml" style="flex:1"><button class="b" id="create">New</button></div>
        <div class="tree" id="tree"></div>
      </div>
      <div>
        <div class="row" style="margin-bottom:.5rem">
          <strong class="mono" id="cur">—</strong>
          <span style="flex:1"></span>
          <button class="b" id="del">Delete</button>
          <button class="b pri" id="save">Save</button>
        </div>
        <div id="editor"></div>
        <div id="save-msg"></div>
      </div>
      <div>
        <div class="panel">
          <h4>Models <span class="muted" id="model-count"></span></h4>
          <input id="model-q" placeholder="Search models…" style="width:100%">
          <div class="row" style="margin:.4rem 0"><select id="model-effort"><option value="">no effort</option></select><span class="muted">click to insert</span></div>
          <div class="models" id="models"></div>
        </div>
        <div class="panel">
          <h4>Store a secret</h4>
          <div style="display:grid;gap:.4rem">
            <select id="sec-acc"></select>
            <input id="sec-title" placeholder="Title (e.g. flotilla: omp models.yml foo apiKey)">
            <input id="sec-val" type="password" placeholder="Secret value">
            <button class="b" id="sec-save">Store in aside-vault and insert reference</button>
          </div>
        </div>
        <div class="panel">
          <h4>Preview on host</h4>
          <div class="row"><select id="prev-host"></select><select id="prev-comp"><option>omp</option><option>ssh</option></select><button class="b" id="prev">Diff</button></div>
        </div>
        <div class="panel"><h4>History</h4><div class="mono muted" id="history" style="max-height:180px;overflow:auto"></div></div>
      </div>
    </div>
  </section>

  <section id="tab-onboard" hidden>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;align-items:start">
      <div>
        <h2>New machine</h2>
        <form class="onb" id="onb">
          <label>Name</label><input name="name" required placeholder="new-box">
          <label>Address</label><input name="address" required placeholder="NetBird IPv4 address">
          <label>User</label><input name="user" required placeholder="ubuntu">
          <label>Platform</label><select name="platform"><option>linux-x64</option><option>linux-arm64</option><option>darwin-arm64</option></select>
          <label>Groups</label><div id="onb-groups" class="row"></div>
          <label>Other names</label><input name="names" placeholder="other DNS names, comma separated">
          <label>Notes</label><textarea name="notes" rows="3" placeholder="Anything the agent should know"></textarea>
          <label>Model</label><input name="model" list="chat-models" value="anthropic/claude-opus-5-5">
          <label>Effort</label><select name="effort"></select>
        </form>
        <datalist id="chat-models"></datalist>
        <div class="row" style="margin-top:.8rem">
          <button class="b" id="onb-add">1. Add to inventory</button>
          <button class="b pri" id="onb-run">2. Run onboarding agent</button>
        </div>
        <pre class="log mono" id="onb-log" hidden></pre>
      </div>
      <div class="guide" id="guide"></div>
    </div>
  </section>

  <section id="tab-jobs" hidden>
    <div id="jobs"></div>
  </section>
</main>
<div class="drawer" id="drawer" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
